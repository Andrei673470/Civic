<title>Golf Comfortline 1.4 2015 | Pedroso Multimarcas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#000000; --ink-2:#4A4A4A; --ink-3:#8A8A8A;
  --line:#E6E6E6; --soft:#F5F5F5;
  --green:#157347; --green-bg:#E7F4EC; --wa:#1FAF5A; --wa-hover:#178F49; --danger:#C62828;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#FFFFFF;--ink:#000000;--ink-2:#4A4A4A;--ink-3:#8A8A8A;--line:#E6E6E6;--soft:#F5F5F5}
}
:root[data-theme="dark"]{--bg:#FFFFFF;--ink:#000000;--ink-2:#4A4A4A;--ink-3:#8A8A8A;--line:#E6E6E6;--soft:#F5F5F5}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,.price{font-family:"Sora","Manrope",system-ui,sans-serif;letter-spacing:-0.02em;font-weight:600;margin:0}
.wrap{max-width:520px;margin:0 auto;padding:20px 20px 40px}
.store{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.store-name{font-family:"Sora",sans-serif;font-weight:600;font-size:17px;letter-spacing:-0.01em}
.store-meta{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.verified{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--green);background:var(--green-bg);padding:6px 10px;border-radius:999px;white-space:nowrap}
.photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;display:block;max-width:100%}
.brand{font-size:13px;color:var(--ink-3);margin:20px 0 2px}
h1{font-size:28px;line-height:1.15}
.price{font-size:34px;margin:10px 0 16px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--green-bg);color:var(--green);font-weight:600;font-size:13.5px;padding:8px 12px;border-radius:10px}
.badge svg{width:16px;height:16px;flex:none}
.lead{color:var(--ink-2);margin:0 0 22px}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:600;font-size:16px;width:100%;min-height:54px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.985)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.link:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.wa{background:var(--wa)}
.btn.wa:hover{background:var(--wa-hover)}
.fine{font-size:12.5px;color:var(--ink-3);text-align:center;margin:12px 0 0;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.progress{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);margin-bottom:8px}
.track{height:4px;background:var(--soft);border-radius:4px;margin-bottom:26px;overflow:hidden}
.fill{height:100%;background:var(--ink);border-radius:4px;transition:width .35s ease}
h2{font-size:23px;line-height:1.25;margin-bottom:20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;margin:0 0 10px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-size:15.5px;cursor:pointer;transition:border-color .15s}
.opt:hover{border-color:#BDBDBD}
.opt .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid #BDBDBD;flex:none;display:flex;align-items:center;justify-content:center}
.opt.sel{border:1.5px solid var(--ink);padding:15.5px}
.opt.sel .dot{border-color:var(--ink);background:var(--ink)}
.opt.sel .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
label.f{display:block;font-size:13.5px;font-weight:600;margin:16px 0 6px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{resize:vertical;min-height:84px}
.phone{display:flex;gap:8px}
.phone select{width:auto;flex:none;padding-right:8px}
.err{font-size:13px;color:var(--danger);min-height:18px;margin-top:6px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
.nav .btn{width:auto;padding:0 26px}
.link{background:none;border:0;font:inherit;font-size:14.5px;color:var(--ink-2);cursor:pointer;padding:10px 4px;display:inline-flex;align-items:center;gap:6px}
.done-icon{width:60px;height:60px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:8px auto 18px}
.summary{border:1px solid var(--line);border-radius:14px;padding:16px;margin:20px 0;font-size:14.5px}
.summary div{display:flex;justify-content:space-between;gap:16px;padding:6px 0}
.summary div+div{border-top:1px solid var(--soft)}
.summary span:first-child{color:var(--ink-3)}
.summary span:last-child{text-align:right;font-weight:500}
.center{text-align:center}
.screen{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.fill{transition:none}}
footer{border-top:1px solid var(--line);margin-top:32px;padding-top:16px;font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.7}
</style>
</head>
