<style>
  :root{
    --bg:#f7f7f5;
    --card:#ffffff;

<script>
/* ====================== CONFIG ====================== */
// Cole aqui a URL do seu Web App do Google Apps Script (veja o arquivo google-apps-script.gs)
const SHEETS_ENDPOINT = "https://script.google.com/macros/s/AKfycbxAwwLUxMIDtivLrrHIH_npqbBge75d9gPKfcasoRn6Y9wqbEY61a7Q-ad9b2U1_1go/exec";
// Número de WhatsApp da concessionária (com DDI e DDD, só números)
const WHATSAPP_NUMBER = "5541997730107";
// Corte mínimo de qualificação (% do potencial daquele caminho do quiz).
// Abaixo disso, não abrimos o formulário de contato — mostramos recusa educada.
const THRESHOLD_PCT_MINIMO = 50;

/* ====================== UTMS DA URL ====================== */
function getParam(name){
  return new URLSearchParams(window.location.search).get(name) || '';
}
const UTMS = {
  utm_source: getParam('utm_source'),
  utm_medium: getParam('utm_medium'),
  utm_campaign: getParam('utm_campaign'),
  utm_content: getParam('utm_content'),
  utm_term: getParam('utm_term')
};

/* ====================== IDENTIFICADOR DE EVENTO (dedup Meta Pixel x CAPI) ====================== */
function fbEventId(){
  try {
    var gtm = window.google_tag_manager['GTM-N89HHJWD'].dataLayer.get('gtm');
    return gtm.start + '.' + gtm.uniqueEventId;
  } catch (e) {
    return 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  }
}

window.dataLayer = window.dataLayer || [];
window.dataLayer.push({
  event: 'page_view',
  event_id: fbEventId(),
  action_source: 'website'
});

/* ====================== PONTUAÇÃO DO LEAD ====================== */
const SCORE_TIPO = { troca:10, financiar:8, avista:10, pesquisando:3 };
const SCORE_URGENCIA = { semana:10, mes:7, '3meses':-5, pesquisando:-10 };
const SCORE_VALOR = { acima50:10, '30a50':10, '20a30':8, ate20:6, naosei:-2 };
const SCORE_PAGAMENTO = { financiamento:10, avista:10, consorcio:6, cartao:6, naosei:-5 };
const SCORE_ENTRADA = { sim:10, parcial:6, so_carro:8, nao:-2 };
const SCORE_NOME_LIMPO = { sim:10, nao:-10, naosei:4 };
const SCORE_VALOR_AVISTA = { completo:10, parcial:6, juntando:-3 };

function calculateScore(){
  const a = state.a;
  let score = 0, max = 0;

  score += SCORE_TIPO[a.tipo] || 0; max += 10;
  score += SCORE_URGENCIA[a.urgencia] || 0; max += 10;

  if(a.valor){ score += SCORE_VALOR[a.valor] || 0; max += 10; }
  if(a.tipo === 'troca' && a.pagamento){ score += SCORE_PAGAMENTO[a.pagamento] || 0; max += 10; }
  if(a.entrada){ score += SCORE_ENTRADA[a.entrada] || 0; max += 10; }
  if(a.nomeLimpo){ score += SCORE_NOME_LIMPO[a.nomeLimpo] || 0; max += 10; }
  if(a.valorAvista){ score += SCORE_VALOR_AVISTA[a.valorAvista] || 0; max += 10; }

  // classificação interna (não aparece pro cliente) — baseada em % sobre o máximo do caminho
  const pct = max > 0 ? Math.round((score / max) * 100) : 0;
  let status = 'lead';
  if(pct >= 80) status = 'quente';
  else if(pct >= 50) status = 'qualificado';

  return { pontuacao: score, lead_status: status, pct: pct };
}

/* ====================== STATE ====================== */
const state = { step: 'intro', history: [], a: {} };

function go(next){ state.history.push(state.step); state.step = next; pushDataLayer(next); render(); }
function back(){ if(state.history.length){ state.step = state.history.pop(); render(); } }
function set(field, value){ state.a[field] = value; }

function pushDataLayer(step){
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'quiz_step', quiz_step: step, quiz_answers: JSON.stringify(state.a) });
}

function nextAfter(step){
  const n = nextAfterRaw(step);
  if(n === 'contato'){
    const c = calculateScore();
    if(c.pct < THRESHOLD_PCT_MINIMO){
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'lead_baixo_score', quiz_answers: JSON.stringify(state.a), pontuacao: c.pontuacao, pct: c.pct });
      return 'semofertas';
    }
  }
  return n;
}

function nextAfterRaw(step){
  const tipo = state.a.tipo;
  if(step === 'etapa1') return 'urgencia';
  if(step === 'urgencia'){
    if(tipo === 'troca') return 'etapa2';
    if(tipo === 'financiar') return 'financ1';
    if(tipo === 'avista') return 'avista1';
    return 'contato';
  }
  if(step === 'etapa2') return 'etapa3';
  if(step === 'etapa3') return 'etapa4';
  if(step === 'etapa4'){
    if(state.a.pagamento === 'financiamento') return 'financ1';
    if(state.a.pagamento === 'avista') return 'avista1';
    return 'contato';
  }
  if(step === 'financ1') return 'financ2';
  if(step === 'financ2') return 'contato';
  if(step === 'avista1') return 'contato';
  if(step === 'contato') return 'resumo';
  return 'contato';
}

function progressPct(){
  const order = ['intro','etapa1','urgencia','etapa2','etapa3','etapa4','financ1','financ2','avista1','contato','resumo'];
  return Math.min(100, Math.round(((order.indexOf(state.step)+1)/9)*100));
}

function opt(label, onclick){
  return '<button type="button" class="opt" onclick="'+onclick+'">'+label+'</button>';
}
function backBtn(){
  return state.history.length ? '<button type="button" class="back-btn" onclick="back()">&larr; Voltar</button>' : '';
}

/* ====================== RENDER ====================== */
function render(){
  const root = document.getElementById('quiz-root');
  document.getElementById('progress-bar').style.width = (state.step === 'semofertas' ? 100 : progressPct())+'%';
  const tipo = state.a.tipo;
  let html = '';

  if(state.step === 'intro'){
    html = '<div class="center">'
      + '<h1>Ótimo ter você por aqui!</h1>'
      + '<p class="lead">Ótima escolha, você está a um passo de adquirir seu novo veículo. Responda algumas perguntas rápidas e a gente te ajuda a encontrar a melhor condição pra você.</p>'
      + '<div class="bullets">'
      + '<p>⏱️ Leva menos de 1 minuto</p>'
      + '<p>🔒 Seus dados são só para contato, com segurança</p>'
      + '<p>💬 Fala direto com um vendedor no WhatsApp</p>'
      + '</div>'
      + '<button type="button" class="btn-primary" onclick="go(\'etapa1\')">Quero simular minha compra</button>'
      + '</div>';
  }

  else if(state.step === 'etapa1'){
    html = backBtn() + '<p class="step-title">O que você está buscando?</p>'
      + opt('Quero trocar de veículo', "set('tipo','troca');go(nextAfter('etapa1'))")
      + opt('Preciso financiar', "set('tipo','financiar');set('pagamento','financiamento');go(nextAfter('etapa1'))")
      + opt('Procuro comprar à vista', "set('tipo','avista');set('pagamento','avista');go(nextAfter('etapa1'))")
      + opt('Ainda estou só pesquisando', "set('tipo','pesquisando');go(nextAfter('etapa1'))");
  }

  else if(state.step === 'urgencia'){
    const label = tipo === 'pesquisando' ? 'Pra quando você imagina decidir?' : 'Pra quando você pretende fechar?';
    html = backBtn() + '<p class="step-title">'+label+'</p>'
      + opt('Essa semana', "set('urgencia','semana');go(nextAfter('urgencia'))")
      + opt('Esse mês', "set('urgencia','mes');go(nextAfter('urgencia'))")
      + opt('Nos próximos 3 meses', "set('urgencia','3meses');go(nextAfter('urgencia'))")
      + opt('Só pesquisando por enquanto', "set('urgencia','pesquisando');go(nextAfter('urgencia'))");
  }

  else if(state.step === 'etapa2'){
    html = backBtn() + '<p class="step-title">Qual carro você pretende dar na troca?</p>'
      + '<p class="step-sub">Só o básico, pra já adiantarmos sua avaliação.</p>'
      + '<input id="marca" placeholder="Marca">'
      + '<input id="modelo" placeholder="Modelo">'
      + '<input id="ano" placeholder="Ano">'
      + '<p class="error" id="err2">Preencha marca, modelo e ano</p>'
      + '<button type="button" class="btn-primary" onclick="submitEtapa2()">Continuar</button>';
  }

  else if(state.step === 'etapa3'){
    html = backBtn() + '<p class="step-title">Você tem uma ideia de quanto vale seu carro?</p>'
      + '<p class="step-sub">Isso é só uma estimativa pra qualificação.</p>'
      + opt('Até R$ 20 mil', "set('valor','ate20');go(nextAfter('etapa3'))")
      + opt('R$ 20 mil a R$ 30 mil', "set('valor','20a30');go(nextAfter('etapa3'))")
      + opt('R$ 30 mil a R$ 50 mil', "set('valor','30a50');go(nextAfter('etapa3'))")
      + opt('Acima de R$ 50 mil', "set('valor','acima50');go(nextAfter('etapa3'))")
      + opt('Não sei quanto vale', "set('valor','naosei');go(nextAfter('etapa3'))");
  }

  else if(state.step === 'etapa4'){
    html = backBtn() + '<p class="step-title">Como pretende pagar a diferença?</p>'
      + opt('Quero financiar', "set('pagamento','financiamento');go(nextAfter('etapa4'))")
      + opt('Tenho dinheiro pra completar', "set('pagamento','avista');go(nextAfter('etapa4'))")
      + opt('Quero usar consórcio', "set('pagamento','consorcio');go(nextAfter('etapa4'))")
      + opt('Quero usar cartão de crédito', "set('pagamento','cartao');go(nextAfter('etapa4'))")
      + opt('Ainda não sei', "set('pagamento','naosei');go(nextAfter('etapa4'))");
  }

  else if(state.step === 'financ1'){
    const tituloEntrada = tipo === 'troca'
      ? 'Além do seu carro na troca, tem algum valor extra pra dar de entrada?'
      : 'Você já tem uma entrada disponível?';
    const opcao3 = tipo === 'troca'
      ? opt('Só o carro mesmo', "set('entrada','so_carro');go(nextAfter('financ1'))")
      : opt('Não tenho entrada', "set('entrada','nao');go(nextAfter('financ1'))");
    html = backBtn() + '<p class="step-title">'+tituloEntrada+'</p>'
      + opt('Sim, tenho valor extra', "set('entrada','sim');go(nextAfter('financ1'))")
      + opt('Uma parte pequena', "set('entrada','parcial');go(nextAfter('financ1'))")
      + opcao3;
  }

  else if(state.step === 'financ2'){
    html = backBtn() + '<p class="step-title">Seu nome está limpo pra crédito?</p>'
      + opt('Sim', "set('nomeLimpo','sim');go(nextAfter('financ2'))")
      + opt('Não', "set('nomeLimpo','nao');go(nextAfter('financ2'))")
      + opt('Não sei', "set('nomeLimpo','naosei');go(nextAfter('financ2'))");
  }

  else if(state.step === 'avista1'){
    html = backBtn() + '<p class="step-title">Como está o valor disponível?</p>'
      + opt('Já tenho o valor todo separado', "set('valorAvista','completo');go(nextAfter('avista1'))")
      + opt('Falta uma parte pequena', "set('valorAvista','parcial');go(nextAfter('avista1'))")
      + opt('Ainda estou juntando', "set('valorAvista','juntando');go(nextAfter('avista1'))");
  }

  else if(state.step === 'semofertas'){
    html = '<div class="center">'
      + '<div style="font-size:32px;">🙏</div>'
      + '<p style="font-weight:600;font-size:16px;margin:8px 0 4px;">Obrigado pelo seu interesse!</p>'
      + '<p class="lead" style="margin-top:8px;">No momento não temos uma condição que encaixe com o que você respondeu. Fique à vontade pra voltar outra hora ou acompanhar nossas novidades.</p>'
      + '</div>';
  }

  else if(state.step === 'contato'){
    html = backBtn() + '<p class="step-title">Pra fechar, precisamos dos seus dados</p>'
      + '<p class="step-sub">Usados só pra contato, com segurança.</p>'
      + '<input id="nome" placeholder="Seu nome">'
      + '<input id="email" type="email" placeholder="Seu e-mail">'
      + '<input id="celular" type="tel" placeholder="Seu celular com DDD">'
      + '<p class="error" id="errc"></p>'
      + '<button type="button" class="btn-primary" onclick="submitContato()">Continuar</button>';
  }

  else if(state.step === 'resumo'){ html = renderResumo(); }

  root.innerHTML = html;
}

function submitEtapa2(){
  const marca = document.getElementById('marca').value.trim();
  const modelo = document.getElementById('modelo').value.trim();
  const ano = document.getElementById('ano').value.trim();
  if(!marca || !modelo || !ano){ document.getElementById('err2').style.display = 'block'; return; }
  set('marca', marca); set('modelo', modelo); set('ano', ano);
  go(nextAfter('etapa2'));
}

function submitContato(){
  const nome = document.getElementById('nome').value.trim();
  const email = document.getElementById('email').value.trim();
  const celular = document.getElementById('celular').value.trim();
  const errEl = document.getElementById('errc');
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const celularOk = celular.replace(/\D/g,'').length >= 10;
  if(!nome){ errEl.textContent = 'Digite seu nome'; errEl.style.display = 'block'; return; }
  if(!emailOk){ errEl.textContent = 'Digite um e-mail válido'; errEl.style.display = 'block'; return; }
  if(!celularOk){ errEl.textContent = 'Digite um celular válido com DDD'; errEl.style.display = 'block'; return; }
  set('nome', nome); set('email', email); set('celular', celular);
  set('event_id', fbEventId());
  const classification = calculateScore();
  set('pontuacao', classification.pontuacao);
  set('lead_status', classification.lead_status);
  showLoading('Enviando seus dados...');
  sendToSheets().finally(function(){ go(nextAfter('contato')); });
}

function showLoading(message){
  document.getElementById('quiz-root').innerHTML =
    '<div class="loading-overlay"><div class="spinner"></div><p>'+message+'</p></div>';
}

/* ====================== GOOGLE SHEETS ====================== */
function sendToSheets(){
  const payload = {
    timestamp: new Date().toISOString(),
    nome: state.a.nome,
    email: state.a.email,
    celular: state.a.celular,
    pontuacao: state.a.pontuacao,
    urgencia: state.a.urgencia,
    veiculo: state.a.marca ? (state.a.marca + ' ' + state.a.modelo + ' ' + state.a.ano) : '',
    utm_source: UTMS.utm_source,
    utm_medium: UTMS.utm_medium,
    utm_campaign: UTMS.utm_campaign,
    utm_content: UTMS.utm_content,
    utm_term: UTMS.utm_term
  };

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'lead_qualificado', lead_data: payload });

  // ======= EVENTO PADRÃO "Lead" (Meta) =======
  window.dataLayer.push({
    event: 'Lead',
    event_id: state.a.event_id,
    action_source: 'website',
    value: 1,
    currency: 'BRL',
    lead_status: state.a.lead_status,
    pontuacao: state.a.pontuacao
  });

  // ======= EVENTO PADRÃO "generate_lead" (GA4) =======
  window.dataLayer.push({
    event: 'generate_lead',
    event_id: state.a.event_id,
    lead_status: state.a.lead_status,
    pontuacao: state.a.pontuacao
  });

  if(state.a.lead_status === 'quente'){
    window.dataLayer.push({ event: 'Lead_Quente', pontuacao: state.a.pontuacao, lead_data: payload });
  }

  if(!SHEETS_ENDPOINT || SHEETS_ENDPOINT.indexOf('COLE_AQUI') === 0){
    console.warn('[Huracan Quiz] SHEETS_ENDPOINT não configurado — nenhum dado foi enviado ao Sheets. Cole a URL do Apps Script no topo do arquivo.');
    return Promise.resolve();
  }

  const qs = Object.keys(payload)
    .map(function(key){ return encodeURIComponent(key) + '=' + encodeURIComponent(payload[key] || ''); })
    .join('&');
  const url = SHEETS_ENDPOINT + '?' + qs;

  console.log('[Huracan Quiz] Enviando lead para o Sheets:', payload);

  // GET + no-cors: o Apps Script (doGet) recebe os parâmetros pela querystring.
  // Não dá pra ler a resposta (status sempre "opaque"), então confiamos que a
  // requisição foi disparada — confira a planilha pra confirmar o recebimento.
  return fetch(url, { method: 'GET', mode: 'no-cors' })
    .then(function(){
      console.log('[Huracan Quiz] Requisição enviada (modo no-cors não confirma sucesso no destino — confira a planilha).');
    })
    .catch(function(err){
      console.error('[Huracan Quiz] Erro ao enviar lead pro Sheets:', err);
    });
}

/* ====================== RESUMO FINAL ====================== */
function renderResumo(){
  const a = state.a;
  const primeiroNome = (a.nome || '').split(' ')[0] || 'você';
  const urgenciaLabel = {semana:'Essa semana', mes:'Esse mês', '3meses':'3 meses', pesquisando:'Pesquisando'}[a.urgencia] || '-';
  const pagamentoLabel = {financiamento:'Financiamento', avista:'À vista', consorcio:'Consórcio', cartao:'Cartão de crédito', naosei:'A definir'}[a.pagamento] || '-';
  const tipoLabel = {troca:'Troca de veículo', financiar:'Financiamento', avista:'Compra à vista', pesquisando:'Pesquisa'}[a.tipo] || '-';

  let carroLinha = '';
  if(a.marca) carroLinha = '<tr><td style="color:var(--text-secondary)">Carro na troca</td><td style="text-align:right;font-weight:600">'+a.marca+' '+a.modelo+' '+a.ano+'</td></tr>';
  let pagamentoLinha = a.pagamento ? '<tr><td style="color:var(--text-secondary)">Pagamento</td><td style="text-align:right;font-weight:600">'+pagamentoLabel+'</td></tr>' : '';
  const objetivoLinha = '<tr><td style="color:var(--text-secondary)">Objetivo</td><td style="text-align:right;font-weight:600">'+tipoLabel+'</td></tr>';

  let mensagem = 'Vamos preparar as melhores condições pra você.';
  if(a.tipo === 'pesquisando') mensagem = 'Sem pressa: deixamos as opções prontas pra quando você decidir.';
  if(a.pagamento === 'financiamento') mensagem = 'Já vamos separar as condições de financiamento que combinam com seu perfil.';
  if(a.pagamento === 'avista') mensagem = 'Já vamos preparar as opções pra fechar à vista.';
  if(a.pagamento === 'consorcio') mensagem = 'Um vendedor vai te explicar as opções de consórcio disponíveis.';
  if(a.pagamento === 'cartao') mensagem = 'Um vendedor vai te explicar as opções de pagamento no cartão.';
  if(a.urgencia === 'semana') mensagem += ' Como é pra essa semana, priorizamos seu atendimento.';

  const origemLinhas =
    (UTMS.utm_campaign ? ('Campanha: ' + UTMS.utm_campaign + '\n') : '')
    + (UTMS.utm_content ? ('Anúncio: ' + UTMS.utm_content + '\n') : '');

  const waText = encodeURIComponent(
    'Olá! Simulei minha compra no site.\n'
    + 'Nome: ' + a.nome + '\n'
    + 'Objetivo: ' + tipoLabel + '\n'
    + (a.marca ? ('Carro na troca: ' + a.marca + ' ' + a.modelo + ' ' + a.ano + '\n') : '')
    + (a.pagamento ? ('Pagamento: ' + pagamentoLabel + '\n') : '')
    + 'Urgência: ' + urgenciaLabel + '\n'
    + origemLinhas
  );
  const waLink = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + waText;

  return '<div class="center" style="margin-bottom:16px;">'
    + '<div style="font-size:32px;">🎉</div>'
    + '<p style="font-weight:600;font-size:16px;margin:8px 0 4px;">Prontinho, '+primeiroNome+'!</p>'
    + '<p style="font-size:13px;color:var(--text-secondary);margin:0;">Seu resumo já foi montado</p>'
    + '</div>'
    + '<div style="border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:14px 0;margin-bottom:14px;">'
    + '<table>' + objetivoLinha + carroLinha + pagamentoLinha
    + '<tr><td style="color:var(--text-secondary)">Urgência</td><td style="text-align:right"><span class="badge">'+urgenciaLabel+'</span></td></tr>'
    + '</table></div>'
    + '<div class="note-box"><p>'+mensagem+'</p></div>'
    + '<a href="'+waLink+'" target="_blank" class="btn-whatsapp" onclick="dataLayerWhatsappClick()">💬 Falar agora no WhatsApp</a>';
}

function dataLayerWhatsappClick(){
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'whatsapp_click',
    lead_status: state.a.lead_status,
    pontuacao: state.a.pontuacao,
    event_id: state.a.event_id
  });

  // ======= EVENTO EXCLUSIVO — clicou pra falar no WhatsApp (nome exato usado no GTM) =======
  window.dataLayer.push({
    event: 'Lead_Qualificado',
    event_id: state.a.event_id,
    pontuacao: state.a.pontuacao,
    lead_status: state.a.lead_status,
    tipo_interesse: state.a.tipo,
    valor_estimado: state.a.valor || '',
    pagamento: state.a.pagamento || ''
  });
}

render();
</script>
</body>
</html>
