<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Quero Comprar Meu Carro - Simule Agora</title>

<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://tracking.huracanmotors.site/ns.html?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-N588MVW');</script>
<!-- End Google Tag Manager -->

<style>
  :root{
    --bg:#f7f7f5;
    --card:#ffffff;
    --border:#e5e3dd;
    --text:#1c1c1a;
    --text-secondary:#6b6a63;
    --accent:#1a56db;
    --accent-text:#ffffff;
    --danger-bg:#fdecec;
    --danger-text:#a32d2d;
    --whatsapp:#25D366;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:32px 16px;
  }
  .wrap{width:100%;max-width:420px;}
  .progress-track{height:4px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden;}
  .progress-bar{height:100%;width:8%;background:var(--accent);transition:width .3s;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px 20px;
    min-height:280px;
  }
  h1{font-size:19px;font-weight:600;margin:0 0 8px;text-align:center;}
  .lead{font-size:14px;color:var(--text-secondary);line-height:1.6;margin:0 0 18px;text-align:center;}
  .bullets{text-align:left;font-size:13px;color:var(--text-secondary);margin-bottom:22px;}
  .bullets p{margin:8px 0;display:flex;align-items:center;gap:8px;}
  .step-title{font-weight:600;font-size:15px;margin:0 0 14px;}
  .step-sub{font-size:13px;color:var(--text-secondary);margin:0 0 14px;}
  .opt{
    display:block;width:100%;text-align:left;
    padding:13px 14px;margin-bottom:8px;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
    font-size:14px;cursor:pointer;color:var(--text);
    transition:border-color .15s;
  }
  .opt:hover{border-color:var(--accent);}
  input{
    width:100%;padding:12px 14px;margin-bottom:10px;
    border:1px solid var(--border);border-radius:var(--radius);
    font-size:14px;background:#fff;color:var(--text);
  }
  input:focus{outline:none;border-color:var(--accent);}
  .btn-primary{
    width:100%;background:var(--accent);color:var(--accent-text);
    border:none;padding:13px;border-radius:var(--radius);
    font-weight:600;font-size:14px;cursor:pointer;margin-top:4px;
  }
  .btn-whatsapp{
    width:100%;background:var(--whatsapp);color:#0b3d1f;border:none;
    padding:13px;border-radius:var(--radius);font-weight:600;font-size:14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
    cursor:pointer;text-decoration:none;
  }
  .back-btn{background:none;border:none;color:var(--text-secondary);font-size:13px;cursor:pointer;padding:0;margin-bottom:14px;}
  .error{color:var(--danger-text);font-size:13px;margin:0 0 10px;display:none;}
  table{width:100%;font-size:13px;border-collapse:collapse;}
  td{padding:6px 0;}
  .badge{background:var(--danger-bg);color:var(--danger-text);font-size:12px;padding:3px 10px;border-radius:8px;}
  .note-box{background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:16px;}
  .note-box p{font-size:13px;color:var(--text-secondary);margin:0;line-height:1.5;}
  .center{text-align:center;}
  .logo-wrap{display:flex;justify-content:center;margin-bottom:20px;}
  .logo-wrap img{height:36px;width:auto;}
  .loading-overlay{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:280px;gap:14px;
  }
  .spinner{
    width:28px;height:28px;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-overlay p{font-size:13px;color:var(--text-secondary);margin:0;}
  .btn-primary[disabled]{opacity:.6;cursor:default;}
</style>
</head>
<body>

<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://tracking.huracanmotors.site/ns.html?id=GTM-N588MVW"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div class="wrap">
  <!-- Troque o src abaixo pelo arquivo real da logo da Huracan Motors -->
  <div class="logo-wrap">
    <img src="https://huracanmotors.site/logo.png" alt="Huracan Motors" onerror="this.style.display='none'">
  </div>
  <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="card" id="quiz-root"></div>
</div>

<script>
/* ====================== CONFIG ====================== */
// Cole aqui a URL do seu Web App do Google Apps Script (veja o arquivo google-apps-script.gs)
const SHEETS_ENDPOINT = "https://script.google.com/macros/s/AKfycbxAYrUmiE2aYbFNN03JdDGfKeeUsQVPbuqaUdOLotcS_XfFGF85tAtSLHRYJdCkJ8A3/exec";
// Número de WhatsApp da concessionária (com DDI e DDD, só números)
const WHATSAPP_NUMBER = "5541984802065";
// Corte mínimo de qualificação (% do potencial daquele caminho do quiz).
// Abaixo disso, não abrimos o formulário de contato — mostramos recusa educada.
const THRESHOLD_PCT_MINIMO = 50;

/* ====================== UTMS DA URL ====================== */
function getParam(name){
  return new URLSearchParams(window.location.search).get(name) || '';
}
const UTMS = {
  utm_source: getParam('utm_source'),
  utm_medium: getParam('utm_medium'),
  utm_campaign: getParam('utm_campaign'),
  utm_content: getParam('utm_content'),
  utm_term: getParam('utm_term')
};

/* ====================== IDENTIFICADOR DE EVENTO (dedup Meta Pixel x CAPI) ====================== */
function fbEventId(){
  try {
    var gtm = window.google_tag_manager['GTM-N588MVW'].dataLayer.get('gtm');
    return gtm.start + '.' + gtm.uniqueEventId;
  } catch (e) {
    return 'evt_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  }
}

window.dataLayer = window.dataLayer || [];
window.dataLayer.push({
  event: 'page_view',
  event_id: fbEventId(),
  action_source: 'website'
});

/* ====================== PONTUAÇÃO DO LEAD ====================== */
// Quiz enxuto: 4 perguntas, todo mundo responde as mesmas, máximo sempre 40.
const SCORE_VEICULO = { correto:10, parcial:4, outro:-8 };
const SCORE_ORCAMENTO = { dentro:10, pouco_acima:5, fora:-8 };
const SCORE_URGENCIA = { semana:10, mes:7, '3meses':-5, pesquisando:-10 };
const SCORE_PAGAMENTO = { troca:8, financiamento:8, avista:10 };

function calculateScore(){
  const a = state.a;
  let score = 0;
  const max = 40;
  score += SCORE_VEICULO[a.veiculo] || 0;
  score += SCORE_ORCAMENTO[a.orcamento] || 0;
  score += SCORE_URGENCIA[a.urgencia] || 0;
  score += SCORE_PAGAMENTO[a.pagamento] || 0;

  const pct = Math.round((score / max) * 100);
  let status = 'lead';
  if(pct >= 80) status = 'quente';
  else if(pct >= 50) status = 'qualificado';

  return { pontuacao: score, lead_status: status, pct: pct };
}

/* ====================== STATE ====================== */
const state = { step: 'intro', history: [], a: {} };

function go(next){ state.history.push(state.step); state.step = next; pushDataLayer(next); render(); }
function back(){ if(state.history.length){ state.step = state.history.pop(); render(); } }
function set(field, value){ state.a[field] = value; }

function pushDataLayer(step){
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'quiz_step', quiz_step: step, quiz_answers: JSON.stringify(state.a) });
}

const ORDER = ['intro','veiculo','orcamento','urgencia','pagamento','contato','resumo'];

function nextAfter(step){
  if(step === 'intro') return 'veiculo';
  if(step === 'veiculo') return 'orcamento';
  if(step === 'orcamento') return 'urgencia';
  if(step === 'urgencia') return 'pagamento';
  if(step === 'pagamento'){
    const c = calculateScore();
    if(c.pct < THRESHOLD_PCT_MINIMO){
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'lead_baixo_score', quiz_answers: JSON.stringify(state.a), pontuacao: c.pontuacao, pct: c.pct });
      return 'semofertas';
    }
    return 'contato';
  }
  if(step === 'contato') return 'resumo';
  return 'contato';
}

function progressPct(){
  if(state.step === 'semofertas') return 100;
  const idx = ORDER.indexOf(state.step);
  return Math.min(100, Math.round(((idx+1)/ORDER.length)*100));
}

function opt(label, onclick){
  return '<button type="button" class="opt" onclick="'+onclick+'">'+label+'</button>';
}
function backBtn(){
  return state.history.length ? '<button type="button" class="back-btn" onclick="back()">&larr; Voltar</button>' : '';
}

/* ====================== RENDER ====================== */
function render(){
  const root = document.getElementById('quiz-root');
  document.getElementById('progress-bar').style.width = progressPct()+'%';
  let html = '';

  if(state.step === 'intro'){
    html = '<div class="center">'
      + '<h1>Ótimo ter você por aqui!</h1>'
      + '<p class="lead">Ótima escolha, você está a um passo de adquirir seu novo veículo. Responda 4 perguntas rápidas e a gente já te chama no WhatsApp com a melhor condição.</p>'
      + '<div class="bullets">'
      + '<p>⏱️ Leva menos de 30 segundos</p>'
      + '<p>🔒 Seus dados são só para contato, com segurança</p>'
      + '<p>💬 Fala direto com um vendedor no WhatsApp</p>'
      + '</div>'
      + '<button type="button" class="btn-primary" onclick="go(nextAfter(\'intro\'))">Quero simular minha compra</button>'
      + '</div>';
  }

  else if(state.step === 'veiculo'){
    html = backBtn() + '<p class="step-title">Esse é o carro que você está procurando?</p>'
      + opt('Sim, é esse mesmo', "set('veiculo','correto');go(nextAfter('veiculo'))")
      + opt('Mais ou menos, mas gostei', "set('veiculo','parcial');go(nextAfter('veiculo'))")
      + opt('Não, quero outro modelo', "set('veiculo','outro');go(nextAfter('veiculo'))");
  }

  else if(state.step === 'orcamento'){
    html = backBtn() + '<p class="step-title">Esse valor está dentro do seu orçamento?</p>'
      + opt('Sim, cabe certinho', "set('orcamento','dentro');go(nextAfter('orcamento'))")
      + opt('Um pouco acima, mas consigo', "set('orcamento','pouco_acima');go(nextAfter('orcamento'))")
      + opt('Está fora do meu orçamento', "set('orcamento','fora');go(nextAfter('orcamento'))");
  }

  else if(state.step === 'urgencia'){
    html = backBtn() + '<p class="step-title">Pra quando você pretende fechar?</p>'
      + opt('Essa semana', "set('urgencia','semana');go(nextAfter('urgencia'))")
      + opt('Esse mês', "set('urgencia','mes');go(nextAfter('urgencia'))")
      + opt('Nos próximos 3 meses', "set('urgencia','3meses');go(nextAfter('urgencia'))")
      + opt('Só pesquisando por enquanto', "set('urgencia','pesquisando');go(nextAfter('urgencia'))");
  }

  else if(state.step === 'pagamento'){
    html = backBtn() + '<p class="step-title">Como pretende pagar?</p>'
      + opt('Troca', "set('pagamento','troca');go(nextAfter('pagamento'))")
      + opt('Financiamento', "set('pagamento','financiamento');go(nextAfter('pagamento'))")
      + opt('À vista', "set('pagamento','avista');go(nextAfter('pagamento'))");
  }

  else if(state.step === 'semofertas'){
    html = '<div class="center">'
      + '<div style="font-size:32px;">🙏</div>'
      + '<p style="font-weight:600;font-size:16px;margin:8px 0 4px;">Obrigado pelo seu interesse!</p>'
      + '<p class="lead" style="margin-top:8px;">No momento não temos uma condição que encaixe com o que você respondeu. Fique à vontade pra voltar outra hora ou acompanhar nossas novidades.</p>'
      + '</div>';
  }

  else if(state.step === 'contato'){
    html = backBtn() + '<p class="step-title">Pra fechar, precisamos dos seus dados</p>'
      + '<p class="step-sub">Usados só pra contato, com segurança.</p>'
      + '<input id="nome" placeholder="Seu nome">'
      + '<input id="email" type="email" placeholder="Seu e-mail">'
      + '<input id="celular" type="tel" placeholder="Seu celular com DDD">'
      + '<p class="error" id="errc"></p>'
      + '<button type="button" class="btn-primary" onclick="submitContato()">Continuar</button>';
  }

  else if(state.step === 'resumo'){ html = renderResumo(); }

  root.innerHTML = html;
}

function submitContato(){
  const nome = document.getElementById('nome').value.trim();
  const email = document.getElementById('email').value.trim();
  const celular = document.getElementById('celular').value.trim();
  const errEl = document.getElementById('errc');
  const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  const celularOk = celular.replace(/\D/g,'').length >= 10;
  if(!nome){ errEl.textContent = 'Digite seu nome'; errEl.style.display = 'block'; return; }
  if(!emailOk){ errEl.textContent = 'Digite um e-mail válido'; errEl.style.display = 'block'; return; }
  if(!celularOk){ errEl.textContent = 'Digite um celular válido com DDD'; errEl.style.display = 'block'; return; }
  set('nome', nome); set('email', email); set('celular', celular);
  set('event_id', fbEventId());
  const classification = calculateScore();
  set('pontuacao', classification.pontuacao);
  set('lead_status', classification.lead_status);
  showLoading('Enviando seus dados...');
  sendToSheets().finally(function(){ go(nextAfter('contato')); });
}

function showLoading(message){
  document.getElementById('quiz-root').innerHTML =
    '<div class="loading-overlay"><div class="spinner"></div><p>'+message+'</p></div>';
}

/* ====================== GOOGLE SHEETS ====================== */
function sendToSheets(){
  const veiculoLabel = { correto:'Sim, é esse mesmo', parcial:'Mais ou menos, mas gostei', outro:'Não, quer outro modelo' }[state.a.veiculo] || '';

  const payload = {
    timestamp: new Date().toISOString(),
    nome: state.a.nome,
    email: state.a.email,
    celular: state.a.celular,
    pontuacao: state.a.pontuacao,
    urgencia: state.a.urgencia,
    veiculo: veiculoLabel,
    utm_source: UTMS.utm_source,
    utm_medium: UTMS.utm_medium,
    utm_campaign: UTMS.utm_campaign,
    utm_content: UTMS.utm_content,
    utm_term: UTMS.utm_term
  };

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'lead_qualificado', lead_data: payload });

  // ======= EVENTO PADRÃO "Lead" (Meta) =======
  window.dataLayer.push({
    event: 'Lead',
    event_id: state.a.event_id,
    action_source: 'website',
    value: 1,
    currency: 'BRL',
    lead_status: state.a.lead_status,
    pontuacao: state.a.pontuacao
  });

  // ======= EVENTO PADRÃO "generate_lead" (GA4) =======
  window.dataLayer.push({
    event: 'generate_lead',
    event_id: state.a.event_id,
    lead_status: state.a.lead_status,
    pontuacao: state.a.pontuacao
  });

  if(state.a.lead_status === 'quente'){
    window.dataLayer.push({ event: 'Lead_Quente', pontuacao: state.a.pontuacao, lead_data: payload });
  }

  if(!SHEETS_ENDPOINT || SHEETS_ENDPOINT.indexOf('COLE_AQUI') === 0){
    console.warn('[Huracan Quiz] SHEETS_ENDPOINT não configurado — nenhum dado foi enviado ao Sheets. Cole a URL do Apps Script no topo do arquivo.');
    return Promise.resolve();
  }

  const qs = Object.keys(payload)
    .map(function(key){ return encodeURIComponent(key) + '=' + encodeURIComponent(payload[key] || ''); })
    .join('&');
  const url = SHEETS_ENDPOINT + '?' + qs;

  console.log('[Huracan Quiz] Enviando lead para o Sheets:', payload);

  return fetch(url, { method: 'GET', mode: 'no-cors' })
    .then(function(){
      console.log('[Huracan Quiz] Requisição enviada (modo no-cors não confirma sucesso no destino — confira a planilha).');
    })
    .catch(function(err){
      console.error('[Huracan Quiz] Erro ao enviar lead pro Sheets:', err);
    });
}

/* ====================== RESUMO FINAL ====================== */
function renderResumo(){
  const a = state.a;
  const primeiroNome = (a.nome || '').split(' ')[0] || 'você';
  const urgenciaLabel = {semana:'Essa semana', mes:'Esse mês', '3meses':'3 meses', pesquisando:'Pesquisando'}[a.urgencia] || '-';
  const pagamentoLabel = {troca:'Troca', financiamento:'Financiamento', avista:'À vista'}[a.pagamento] || '-';
  const veiculoLabel = { correto:'É esse mesmo carro', parcial:'Parecido com o que procura', outro:'Procura outro modelo' }[a.veiculo] || '-';
  const orcamentoLabel = { dentro:'Dentro do orçamento', pouco_acima:'Um pouco acima, mas consegue', fora:'Fora do orçamento' }[a.orcamento] || '-';

  let mensagem = 'Vamos preparar as melhores condições pra você.';
  if(a.pagamento === 'financiamento') mensagem = 'Já vamos separar as condições de financiamento que combinam com seu perfil.';
  if(a.pagamento === 'avista') mensagem = 'Já vamos preparar as opções pra fechar à vista.';
  if(a.pagamento === 'troca') mensagem = 'Já vamos preparar as condições pra avaliar seu carro na troca.';
  if(a.urgencia === 'semana') mensagem += ' Como é pra essa semana, priorizamos seu atendimento.';

  const origemLinhas =
    (UTMS.utm_campaign ? ('Campanha: ' + UTMS.utm_campaign + '\n') : '')
    + (UTMS.utm_content ? ('Anúncio: ' + UTMS.utm_content + '\n') : '');

  const waText = encodeURIComponent(
    'Olá! Simulei minha compra no site.\n'
    + 'Nome: ' + a.nome + '\n'
    + 'Veículo anunciado: ' + veiculoLabel + '\n'
    + 'Orçamento: ' + orcamentoLabel + '\n'
    + 'Pagamento: ' + pagamentoLabel + '\n'
    + 'Urgência: ' + urgenciaLabel + '\n'
    + origemLinhas
  );
  const waLink = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + waText;

  return '<div class="center" style="margin-bottom:16px;">'
    + '<div style="font-size:32px;">🎉</div>'
    + '<p style="font-weight:600;font-size:16px;margin:8px 0 4px;">Prontinho, '+primeiroNome+'!</p>'
    + '<p style="font-size:13px;color:var(--text-secondary);margin:0;">Seu resumo já foi montado</p>'
    + '</div>'
    + '<div style="border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:14px 0;margin-bottom:14px;">'
    + '<table>'
    + '<tr><td style="color:var(--text-secondary)">Veículo</td><td style="text-align:right;font-weight:600">'+veiculoLabel+'</td></tr>'
    + '<tr><td style="color:var(--text-secondary)">Pagamento</td><td style="text-align:right;font-weight:600">'+pagamentoLabel+'</td></tr>'
    + '<tr><td style="color:var(--text-secondary)">Urgência</td><td style="text-align:right"><span class="badge">'+urgenciaLabel+'</span></td></tr>'
    + '</table></div>'
    + '<div class="note-box"><p>'+mensagem+'</p></div>'
    + '<a href="'+waLink+'" target="_blank" class="btn-whatsapp" onclick="dataLayerWhatsappClick()">💬 Falar agora no WhatsApp</a>';
}

function dataLayerWhatsappClick(){
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: 'whatsapp_click',
    lead_status: state.a.lead_status,
    pontuacao: state.a.pontuacao,
    event_id: state.a.event_id
  });

  window.dataLayer.push({
    event: 'Lead_Qualificado',
    event_id: state.a.event_id,
    pontuacao: state.a.pontuacao,
    lead_status: state.a.lead_status,
    veiculo: state.a.veiculo,
    orcamento: state.a.orcamento,
    pagamento: state.a.pagamento || ''
  });
}

render();
</script>
</body>
</html>
