<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obrigado! Redirecionando...</title>

<!-- Redirecionamento automático em 3s (fallback caso o JS não rode a tempo) -->
<meta http-equiv="refresh" content="3;url=https://wa.me/5541997730107?text=Vi%20o%20307%20no%20site%20e%20tenho%20interesse%20na%20compra">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;
    --surface:#151515;
    --accent:#F38120;
    --text:#F7F6F4;
    --text-secondary:#ACACA9;
    --success:#57B37B;
    --success-bg:#173325;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:380px;
    width:100%;
    text-align:center;
  }
  .icon{
    width:72px; height:72px; border-radius:50%;
    background:var(--success-bg); color:var(--success);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 24px;
    font-size:32px;
  }
  .spinner{
    width:38px; height:38px;
    border:3px solid rgba(255,255,255,0.14);
    border-top-color:var(--accent);
    border-radius:50%;
    margin:0 auto 22px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{
    to{transform:rotate(360deg);}
  }
  .title{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800; font-size:26px;
    margin-bottom:10px;
  }
  .text{
    font-size:14.5px; color:var(--text-secondary);
    line-height:1.55;
    margin-bottom:26px;
  }
  .progress-bar{
    width:100%; height:4px;
    background:rgba(255,255,255,0.1);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:24px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    animation:fill 3s linear forwards;
  }
  @keyframes fill{
    to{width:100%;}
  }
  .manual-link{
    display:inline-block;
    font-size:13px;
    color:var(--text-secondary);
    text-decoration:underline;
  }
  .manual-link:hover{
    color:var(--accent);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon">✓</div>
    <div class="spinner"></div>
    <div class="title">Show, recebemos seu contato!</div>
    <div class="text">Te levando para o WhatsApp do vendedor...</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <a class="manual-link" id="manual-link" href="https://wa.me/5541997730107?text=Vi%20o%20307%20no%20site%20e%20tenho%20interesse%20na%20compra">
      Não foi redirecionado? Clique aqui
    </a>
  </div>

  <script>
    // Redirecionamento via JS (mais confiável que o meta refresh sozinho)
    setTimeout(function () {
      window.location.href = "https://wa.me/5541997730107?text=Vi%20o%20307%20no%20site%20e%20tenho%20interesse%20na%20compra";
    }, 3000);
  </script>

</body>
</html>
