<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }

  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 48px 36px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 24px 60px rgba(0,0,0,.4);
  }
  @media(max-width:480px){ .card{ padding: 32px 22px; } }

  .check-ico {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #25D366, #1dab52);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    box-shadow: 0 8px 24px rgba(37,211,102,.35);
    animation: pop .4s ease;
  }
  @keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .check-ico svg { width: 36px; height: 36px; }

  .titulo {
    font-family: "Montserrat", sans-serif;
    font-weight: 900;
    font-size: clamp(22px, 5vw, 30px);
    color: #fff;
    margin-bottom: 12px;
    line-height: 1.15;
  }
  .titulo span { color: #FF6B00; }

  .texto {
    font-size: 15px;
    color: #888;
    line-height: 1.65;
    margin-bottom: 32px;
  }
  .texto strong { color: #ccc; }

  .btn-wa {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #25D366;
    color: #fff;
    font-family: "Montserrat", sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .5px;
    text-transform: uppercase;
    padding: 18px 28px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    width: 100%;
    transition: .2s;
    text-decoration: none;
  }
  .btn-wa:hover {
    background: #1dab52;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(37,211,102,.35);
  }

  .divider {
    height: 1px;
    background: #2a2a2a;
    margin: 28px 0;
  }

  .info-box {
    background: rgba(255,107,0,.08);
    border: 1px solid rgba(255,107,0,.2);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    color: #aaa;
    line-height: 1.55;
    margin-bottom: 28px;
  }
  .info-box span { color: #FF9500; font-weight: 600; }

  .logo {
    margin-top: 32px;
    font-family: "Montserrat", sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #333;

<script>
  // Recupera dados salvos da landing page
  var cel = sessionStorage.getItem('lead_cel') || '';
  var eml = sessionStorage.getItem('lead_eml') || '';
  var cid = sessionStorage.getItem('lead_cid') || '';

  // Dispara PageView no GTM
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'obrigado_pageview', click_id: cid });

  async function abrirWa() {
    var btn = document.getElementById('btnWa');
    btn.textContent = 'Abrindo WhatsApp...';
    btn.style.opacity = '0.8';

    // 1. Dispara evento qualified_lead ANTES de abrir WhatsApp
    window.dataLayer = window.dataLayer || [];

    await new Promise(function(resolve) {
      window.dataLayer.push({
        event: 'qualified_lead',
        click_id: cid,
        phone: cel,
        email: eml
      });
      // Aguarda 200ms para garantir envio ao GTM
      setTimeout(resolve, 200);
    });

    // 2. Monta mensagem e abre WhatsApp
    var msg = 'Olá! Tenho interesse no Peugeot 307 Presence Pack 1.6 2010.';
    if (cel) msg += '\nCelular: ' + cel;
    if (eml) msg += '\nE-mail: ' + eml;

    window.open('https://wa.me/5541997730107?text=' + encodeURIComponent(msg), '_blank');

    // 3. Limpa sessionStorage
    sessionStorage.removeItem('lead_cel');
    sessionStorage.removeItem('lead_eml');
    sessionStorage.removeItem('lead_cid');

    // 4. Restaura botão
    setTimeout(function() {
      btn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.549 4.18 1.595 5.996L0 24l6.196-1.573A11.954 11.954 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.027-1.38l-.36-.214-3.676.934.975-3.565-.234-.368A9.818 9.818 0 1112 21.818z"/></svg> Falar com um consultor no WhatsApp';
