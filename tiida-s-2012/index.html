<!-- Google Tag Manager -->
<script>
(function(w,d,s,l,i){
  w[l]=w[l]||[];
  w[l].push({'gtm.start': new Date().getTime(), event:'gtm.js'});
  var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s);
  j.async=true;
  j.src='https://sgtm.pedrosomultimarcassjp.site/gtm.js?id=' + i;
  f.parentNode.insertBefore(j,f);

<style>
body{font-family:Arial,sans-serif;padding:20px;background:#111;color:#fff}

<body>

<h1>Quiz Tiida</h1>
<p>Arquivo corrigido para GTM Server-Side e Meta Pixel/CAPI.</p>

<script>
window.dataLayer = window.dataLayer || [];

function getTrackingParams(){
  const p = new URLSearchParams(location.search);
  return {
    fbclid: p.get('fbclid') || '',
    utm_source: p.get('utm_source') || '',
    utm_medium: p.get('utm_medium') || '',
    utm_campaign: p.get('utm_campaign') || ''
  };
}

const trackingParams = getTrackingParams();

// Page view corrigido
dataLayer.push({
  event: 'page_view',
  action_source: 'website',
  ...trackingParams
});

function enviarLead(){
  dataLayer.push({
    event: 'quiz_completed',
    action_source: 'website',
    email: 'teste@exemplo.com',
    phone: '+5541999999999',
    ...trackingParams
  });

  alert('Evento enviado ao dataLayer');
}
</script>

<button onclick="enviarLead()">Testar envio</button>

</body>
