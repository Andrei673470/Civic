<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Falar com o Andrei no WhatsApp</title>
<!-- Plano B: se o JavaScript estiver desativado, redireciona em 4 segundos -->
<meta http-equiv="refresh" content="4;url=https://wa.me/5541997730107?text=Ol%C3%A1%20Andrei!%20Tenho%20interesse%20em%20um%20ve%C3%ADculo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #0F2A33;
    --fundo-2: #163A45;
    --texto: #F2F6F5;
    --texto-suave: #A9C1C4;
    --verde: #25D366;
    --verde-escuro: #1DA851;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--fundo-2), var(--fundo) 70%);
    background-color: var(--fundo);
    color: var(--texto);
    display: grid;
    place-items: center;
    padding: 1.5rem;
    text-align: center;
  }
  main { max-width: 30rem; }

  .contador {
    position: relative;
    width: 7.5rem;
    height: 7.5rem;
    margin: 0 auto 2rem;
  }
  .contador svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .contador circle { fill: none; stroke-width: 6; }
  .trilha { stroke: rgba(255,255,255,.12); }
  .progresso {
    stroke: var(--verde);
    stroke-linecap: round;
    stroke-dasharray: 283;
    stroke-dashoffset: 0;
    animation: esvaziar 3s linear forwards;
  }
  .numero {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 2.75rem;
    font-weight: 800;
  }
  @keyframes esvaziar { to { stroke-dashoffset: 283; } }

  h1 {
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 1rem;
  }
  p {
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--texto-suave);
    margin-bottom: 2rem;
  }
  p strong { color: var(--texto); font-weight: 600; }

  .botao {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    background: var(--verde);
    color: #0B2A17;
    font-weight: 800;
    font-size: 1rem;
    text-decoration: none;
    padding: .95rem 1.6rem;
    border-radius: 999px;
    transition: background .2s;
  }
  .botao:hover { background: var(--verde-escuro); }
  .botao:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
  .botao svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }

  @media (prefers-reduced-motion: reduce) {
    .progresso { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="contador" aria-hidden="true">
    <svg viewBox="0 0 100 100">
      <circle class="trilha" cx="50" cy="50" r="45"/>
      <circle class="progresso" cx="50" cy="50" r="45"/>
    </svg>
    <div class="numero" id="numero">3</div>
  </div>

  <h1>Obrigado pelo seu interesse!</h1>
  <p>
    O vendedor <strong>Andrei</strong> vai te atender pessoalmente e ajudar
    você a encontrar o veículo ideal. Em <strong id="segundos">3 segundos</strong>
    você será levado direto para o WhatsApp dele.
  </p>

  <a class="botao" id="botao" href="https://wa.me/5541997730107?text=Ol%C3%A1%20Andrei!%20Tenho%20interesse%20em%20um%20ve%C3%ADculo.">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>
    Abrir WhatsApp agora
  </a>
</main>

<script>
  var destino = document.getElementById("botao").href;
  var restante = 3;
  var numero = document.getElementById("numero");
  var segundos = document.getElementById("segundos");

  var timer = setInterval(function () {
    restante--;
    if (restante > 0) {
      numero.textContent = restante;
      segundos.textContent = restante + (restante === 1 ? " segundo" : " segundos");
    } else {
      clearInterval(timer);
      numero.textContent = "✓";
      segundos.textContent = "instantes";
      window.location.href = destino;
    }
  }, 1000);
</script>
</body>
</html>
